<style>

@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f7faf7;--el:#fff;--fg:#0d1a12;--dim:#5b6b60;--bd:rgba(0,0,0,.14)}}
:root[data-theme="light"]{--bg:#f7faf7;--el:#fff;--fg:#0d1a12;--dim:#5b6b60;--bd:rgba(0,0,0,.14)}
:root[data-theme="dark"]{--bg:#0a0f0c;--el:#121a15;--fg:#f4f6f4;--dim:#93a097;--bd:rgba(255,255,255,.12)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif;overflow-x:hidden}
.d{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1}
a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.nav{max-width:1150px;margin:auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-size:24px}.logo span{color:var(--g)}.links{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;font-weight:500}.links a{color:var(--dim)}.links a.on,.links a:hover{color:var(--fg)}
main{max-width:1150px;margin:auto;padding:0 20px 50px}
.hero{padding:56px 0 24px}.hero h1{font-size:clamp(42px,9vw,96px);margin:0 0 14px}.hero h1 span{color:var(--g)}.hero p{color:var(--dim);max-width:560px;font-size:18px}
.btn{background:var(--g);color:#031;border:1px solid var(--g);padding:11px 18px;font-weight:700;font-size:13px;text-transform:uppercase;cursor:pointer;display:inline-block}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--bd)}.btn.wa{background:var(--wa);border-color:var(--wa)}.btn[disabled]{opacity:.4;pointer-events:none}
.sec{margin-top:48px}.sh{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.sh h2{font-size:34px;margin:0}.sh a{color:var(--g);font-size:14px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--el);border:1px solid var(--bd);display:flex;flex-direction:column}.card:hover{border-color:var(--y)}
.im{aspect-ratio:16/10;background:linear-gradient(135deg,#063d22,#1a1a05);display:grid;place-items:center;font-size:40px;position:relative;overflow:hidden}.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:8px;left:8px;background:var(--y);color:#000;font-size:10px;font-weight:700;padding:3px 7px;z-index:1;text-transform:uppercase}
.pr{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.85);color:#fff;padding:4px 9px;font-size:14px;z-index:1}
.bd{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}.bd h3{margin:0;font-size:19px}.bd p{margin:0;color:var(--dim);font-size:14px;flex:1}
.meta{font-size:11px;color:var(--dim);text-transform:uppercase}
.art{max-width:720px;margin:32px auto}.art h1{font-size:clamp(32px,6vw,52px)}.art p{line-height:1.75;color:var(--dim);font-size:17px}
input,textarea,select{background:var(--el);border:1px solid var(--bd);padding:10px;width:100%;border-radius:0}
label{display:grid;gap:5px;font-size:11px;color:var(--dim);text-transform:uppercase}
.box{background:var(--el);border:1px solid var(--bd);padding:20px;display:grid;gap:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid var(--bd);background:none;padding:8px 14px;cursor:pointer}.tab.on{background:var(--fg);color:var(--bg)}
.ar{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
.pub{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--y);color:#000;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;margin-top:20px}
.err{color:#ff5a4d;font-size:13px;min-height:16px}
dialog{background:var(--el);color:var(--fg);border:1px solid var(--bd);width:min(480px,94vw);padding:22px}dialog::backdrop{background:rgba(0,0,0,.7)}
footer{border-top:1px solid var(--bd);padding:28px 20px;text-align:center;color:var(--dim);font-size:13px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;z-index:50;font-size:13px}
.lk{color:var(--g);text-decoration:underline}.tags{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.chip{border:1px solid var(--bd);padding:5px 12px;font-size:13px;border-radius:99px}.chip:hover{border-color:var(--g)}
.pi{width:100%;margin:16px 0;display:block}.th{width:64px;height:48px;object-fit:cover}.body h2{font-size:28px;margin:28px 0 8px}.body blockquote{border-left:3px solid var(--g);margin:18px 0;padding:4px 16px;color:var(--fg);font-size:19px}.body ul{color:var(--dim);line-height:1.8}
.sf{display:flex;gap:6px}.sf input{width:190px;padding:8px 10px}.sf .btn{padding:8px 12px}textarea{resize:vertical}
.mb{display:none;background:none;border:1px solid var(--bd);width:42px;height:42px;place-items:center;cursor:pointer}
.panel{display:flex;align-items:center;gap:18px;flex:1;justify-content:flex-end;flex-wrap:wrap}
.sf .btn{display:grid;place-items:center;padding:9px 12px}
.note{border:1px dashed var(--bd);padding:12px 14px;font-size:13px;color:var(--dim);margin-top:24px}

/* Standard, balanced header and responsive navigation */
.nav{max-width:1200px;min-height:76px;padding:12px 24px;display:flex;align-items:center;gap:24px;flex-wrap:nowrap;position:relative}
.logo{display:inline-flex;align-items:center;white-space:nowrap;font-size:27px;letter-spacing:-1.2px;flex:0 0 auto;position:absolute;left:50%;transform:translateX(-50%);z-index:2}
.panel{display:flex;align-items:center;justify-content:flex-start;gap:0;flex:1;min-width:0}
.links{display:flex;align-items:center;justify-content:center;gap:clamp(12px,1.7vw,24px);flex-wrap:nowrap}
.links a{white-space:nowrap;padding:10px 0;font-size:14px}
.search-area{flex:0 0 auto;margin-left:auto;z-index:3}
.search-toggle{border-radius:50%;border-color:transparent;background:var(--el)}
.login-wrap{min-height:calc(100vh - 190px);display:grid;place-items:center;padding:42px 16px}
.login-card{width:min(100%,430px);background:var(--el);border:1px solid var(--bd);padding:clamp(22px,5vw,36px);display:grid;gap:16px;box-shadow:0 20px 70px rgba(0,0,0,.2)}
.login-mark{width:48px;height:48px;background:var(--g);color:#031;display:grid;place-items:center;font-weight:900;font-size:26px}
.login-kicker{font-size:11px;letter-spacing:2px;color:var(--g);font-weight:700;margin:4px 0 -10px}
.login-card h1{font-size:34px;margin:0}
.login-desc,.login-hint{margin:0;color:var(--dim);line-height:1.6;font-size:14px}
.login-card label{gap:8px}
.login-card input{min-height:46px}
.login-card .btn{width:100%;min-height:46px}
.login-back{font-size:13px;color:var(--dim);text-align:center;padding-top:4px}
.not-found{min-height:65vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 16px}
.nf-code{font-size:clamp(76px,18vw,150px);font-weight:900;line-height:.9;color:var(--g);letter-spacing:-.08em}
.not-found h1{font-size:clamp(28px,5vw,42px);margin:24px 0 8px}
.not-found p{color:var(--dim);max-width:420px;line-height:1.6;margin:0 0 24px}
@media(max-width:860px){
 .nav{padding:10px 16px;gap:10px;min-height:66px}
 .logo{font-size:23px}
 .panel{justify-content:flex-start}
 .links{gap:12px}
 .search-area{margin-left:0}
}
@media(max-width:680px){
 .nav{gap:10px}
 .mb{flex:0 0 40px;width:40px;height:40px;border:0;z-index:3}
 .logo{font-size:21px;max-width:calc(100% - 130px)}
 .panel{position:absolute;left:0;right:0;top:100%;padding:10px 20px 18px;background:var(--bg);border-bottom:1px solid var(--bd);display:none;align-items:stretch;justify-content:flex-start}
 header.open .panel{display:flex}
 .links{width:100%;align-items:stretch;flex-direction:column;gap:0}
 .links a{padding:13px 0;border-bottom:1px solid var(--bd);font-size:15px}
 .search-area{margin-left:auto}
 .search-toggle{width:40px;height:40px}
 header.search-open .sf{right:0;top:calc(100% + 10px)}
}

/* Header search: compact icon that expands an accessible search field on demand. */
.search-area{position:relative;display:flex;align-items:center;gap:8px}
.search-toggle{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--bd);background:transparent;cursor:pointer;color:var(--fg)}
.search-toggle:hover,.search-toggle:focus-visible{border-color:var(--g);outline-offset:3px}
.sf{display:none;align-items:center;gap:6px}
header.search-open .sf{display:flex;position:absolute;right:0;top:calc(100% + 12px);width:min(340px,calc(100vw - 32px));padding:10px;background:var(--el);border:1px solid var(--bd);box-shadow:0 12px 32px rgba(0,0,0,.28);z-index:25}
.sf input{width:100%;min-width:0}
.sf .btn{display:grid;place-items:center;flex:0 0 auto}
@media(max-width:860px){.search-area{margin-left:auto}.search-toggle{width:42px;height:42px}.panel{right:0}.sf input{width:100%;flex:1}}

@media(max-width:860px){.mb{display:grid}.nav{flex-wrap:nowrap}.panel{display:none;position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--bd);padding:8px 20px 18px;flex-direction:column;align-items:stretch;gap:12px;max-height:80vh;overflow:auto}header.open .panel{display:flex}.links{flex-direction:column;gap:0}.links a{padding:13px 0;border-bottom:1px solid var(--bd);font-size:17px}.sf{width:100%}.sf input{width:100%;flex:1}}
.eps{display:flex;flex-wrap:wrap;gap:10px}.btn.ep{min-width:120px;text-align:center}.btn.off{opacity:.35;pointer-events:none;background:transparent;color:var(--fg);border-color:var(--bd)}

/* compact cards: 2 columns on phones, max 3 on wide screens */
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}}
.im{aspect-ratio:4/3;font-size:28px}
.bd{padding:9px;gap:5px}.bd h3{font-size:14px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bd p{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:0 1 auto}
.bd .meta{font-size:10px}.bd .btn{padding:7px 8px;font-size:10px;text-align:center}
.tag{font-size:9px;padding:2px 6px;top:6px;left:6px}.pr{font-size:12px;padding:3px 7px;bottom:6px;right:6px}
.sh h2{font-size:26px}.sec{margin-top:36px}

#loader{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .35s,visibility .35s}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.sp{width:44px;height:44px;border:4px solid var(--bd);border-top-color:var(--g);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#topbar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--g);z-index:99}
#topbar.run{animation:bar .6s ease-out forwards}
@keyframes bar{0%{width:0;opacity:1}80%{width:100%;opacity:1}100%{width:100%;opacity:0}}
/* hero slider */
.hs{position:relative;overflow:hidden;margin:20px 0 8px;border:1px solid var(--bd);touch-action:pan-y}
.hs-track{display:flex;transition:transform .55s cubic-bezier(.4,0,.2,1)}
.sl{min-width:100%;position:relative;min-height:300px;aspect-ratio:16/7;display:flex;align-items:flex-end;background:linear-gradient(135deg,#063d22,#1a1a05)}
.sl>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sl.ov::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,.2) 70%)}
.sl .c{position:relative;z-index:2;padding:22px 22px 44px;max-width:680px;color:#fff}
.sl h2{font-size:clamp(26px,5.5vw,54px);margin:8px 0}.sl p{color:rgba(255,255,255,.8);margin:0 0 14px;font-size:15px}
.sl .kd{display:inline-block;background:var(--y);color:#000;font-size:11px;font-weight:700;padding:3px 9px;text-transform:uppercase}
.sl.in{background:radial-gradient(circle at 80% 20%,#0a6b38,#0a0f0c 70%)}.sl.in h2{font-size:clamp(36px,8vw,84px)}.sl.in h2 span{color:var(--g)}
.hb{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;cursor:pointer}.hb.l{left:10px}.hb.r{right:10px}
.dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:3}.dots i{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.4);cursor:pointer;transition:.3s}.dots i.on{background:var(--g);width:24px}
/* refined mobile menu */
@media(max-width:860px){
 .panel{display:flex;visibility:hidden;opacity:0;transform:translateY(-10px);transition:opacity .22s,transform .22s,visibility .22s;border-radius:0 0 16px 16px;box-shadow:0 18px 40px rgba(0,0,0,.45);padding:14px 20px 20px}
 header.open .panel{visibility:visible;opacity:1;transform:none}
 .sf{order:-1}.sf input{padding:12px;font-size:16px}
 .links a{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--bd);font-size:17px;font-weight:500}
 .links a.on{color:var(--g);border-left:3px solid var(--g);padding-left:10px}
 .links a::after{content:'›';color:var(--dim);font-size:20px}
 .sl{aspect-ratio:auto;min-height:340px}
}
</style>
